quarkus.application.name=race-ops
quarkus.http.port=8081

# The management interface carries the health endpoints on the cluster (port 9000), off the
# main port: kubelet probes cannot present the client certificate the mtls profile requires,
# and the CallerAllowList filter applies to the main router only. Dev and tests keep the
# endpoints on the main port, where nothing requires a certificate.
%openshift-cluster.quarkus.management.enabled=true

# The default image builder is the OpenShift s2i one that quarkus-openshift brings: it is what
# scripts/deploy-openshift.sh deploys with. The GitHub Actions image workflow overrides this
# with -Dquarkus.container-image.builder=podman to push to ghcr.io; with both extensions
# present, one of them has to be selected explicitly or the build fails.
quarkus.container-image.builder=openshift

# Same path as the game's, so one scrape config covers both apps. A cluster deployment serves
# this under the /ops root path, next to the console.
quarkus.micrometer.export.prometheus.path=/metrics

# The game's dashboard fetches the director console cross-origin in dev (the game is on 8080).
# A deployment routes race-ops under the game's own host, so the fetch is same-origin there.
%dev.quarkus.http.cors.enabled=true
%dev.quarkus.http.cors.origins=http://localhost:8080
%dev.quarkus.http.cors.methods=GET,POST

# The game's read-only MCP server. The admin client (start, pause, boost, themes) arrives with the director.
quarkus.langchain4j.mcp.race.transport-type=streamable-http
quarkus.langchain4j.mcp.race.url=http://localhost:8080/mcp
# Pin the protocol the game speaks, 2026-07-28: stateless requests, no session and no
# initialization handshake. Without the pin the client probes for it on first use and waits 30 s
# for an answer the server never gives, which eats the director's decision budget.
quarkus.langchain4j.mcp.race.protocol-version=2026-07-28
# Resource-update notifications only arrive when the subsidiary SSE channel of the streamable transport is on.
quarkus.langchain4j.mcp.race.subsidiary-channel=true
# Not through an OpenShift edge route: the channel holds a silent stream open, the router waits for
# response headers and answers 504 after 30 s, and the client then stops reading. The watcher's 5 s
# poll fallback keeps the snapshots fresh instead, which is enough for a 30-60 s race.
%openshift-cluster.quarkus.langchain4j.mcp.race.subsidiary-channel=false

# The admin client: same game, race control tools, behind OIDC. Health checks run without the
# auth token, so they are off to avoid reconnect churn against the token-gated endpoint.
quarkus.langchain4j.mcp.race-admin.transport-type=streamable-http
quarkus.langchain4j.mcp.race-admin.url=http://localhost:8080/admin/mcp
quarkus.langchain4j.mcp.race-admin.protocol-version=2026-07-28
quarkus.langchain4j.mcp.race-admin.auto-health-check=false

# The director's token in dev: direct grant against the game's dev Keycloak, whose
# mcp-agent client allows it in dev only. Scoped to %dev so a deployment without its
# own credentials fails closed instead of quietly using these. A deployment sets
# QUARKUS_OIDC_CLIENT_* for a confidential client with the admin role.
%dev.quarkus.oidc-client.auth-server-url=http://localhost:8181/realms/wind-turbine
%dev.quarkus.oidc-client.client-id=mcp-agent
%dev.quarkus.oidc-client.grant.type=password
%dev.quarkus.oidc-client.grant-options.password.username=developer
%dev.quarkus.oidc-client.grant-options.password.password=developer

# When the game or its Keycloak is unreachable the director reports it once itself (log line and
# console), so the OIDC client's own stack trace for every connection retry only repeats it.
quarkus.log.category."io.quarkus.oidc.client.runtime.OidcClientImpl".level=OFF
quarkus.log.category."io.quarkus.oidc.common.runtime.OidcCommonUtils".level=OFF

# The director runs the event between races: start on a join plateau, propose boosts and
# themes. Off by default so nothing acts on the game unless asked.
race-ops.director-enabled=false
%dev.race-ops.director-enabled=true

# The director's advice model: the same hosted OpenAI-compatible endpoint as the game, overridable
# with the standard OPENAI_* variables. It phrases what the analyst found; with the flag off the
# director falls back to a template proposal, and the analyst still supplies the numbers.
race-ops.ai-enabled=false
%dev.race-ops.ai-enabled=true
quarkus.langchain4j.openai.enable-integration=${race-ops.ai-enabled}
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:unused}
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.enmaas.devshift.net/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:rits/zai-org/glm-5-3}
quarkus.langchain4j.openai.timeout=10s
quarkus.langchain4j.openai.chat-model.max-completion-tokens=512
quarkus.langchain4j.openai.chat-model.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
quarkus.langchain4j.openai.max-retries=1

# The A2A mesh: race-analyst (8082) and race-creative (8083), each its own Quarkus app so one can
# be restarted or killed on stage without touching the others. Off by default: a bare start and the
# test suite need nobody else, and every mesh call has an in-process fallback.
race-ops.mesh-enabled=false
%dev.race-ops.mesh-enabled=true
race-ops.analyst.a2a-url=http://localhost:8082/
race-ops.creative.a2a-url=http://localhost:8083/

# What the creative director is proposing for, passed to race-creative. Concrete, because the
# agent turns it into the brief the game's generator receives.
race-ops.event-name=a developer conference
race-ops.audience=a room of developers

# Tests never talk to a server: the watcher stays off, the mesh stays off, and the client stops
# health-checking an unreachable URL.
%test.race-ops.watcher-enabled=false
%test.race-ops.mesh-enabled=false
%test.quarkus.langchain4j.mcp.race.auto-health-check=false
%test.quarkus.oidc-client.auth-server-url=http://127.0.0.1:1/realms/wind-turbine
# A test that boots the whole app also creates the OIDC client at startup, which fails closed
# without a client id before any test runs. These values are never used: no test calls the game
# or Keycloak. The dev grant above is scoped to %dev, so tests need their own.
%test.quarkus.oidc-client.client-id=test
%test.quarkus.oidc-client.grant.type=client
%test.quarkus.oidc-client.credentials.secret=test

############## Cluster deployment ##############
# Deployed by scripts/deploy-openshift.sh next to the game, one replica (five would mean five
# directors racing to start and restyle). Everything is served under /ops because OpenShift
# routes do not rewrite paths: the game's host carries /ops to this service, so the dashboard's
# console fetch is same-origin (game.ops.url=/ops) and no CORS is needed.

%openshift-cluster.quarkus.kubernetes.deployment-target=openshift
%openshift-cluster.quarkus.openshift.deployment-kind=Deployment
%openshift-cluster.quarkus.openshift.replicas=1
%openshift-cluster.quarkus.openshift.route.expose=false
%openshift-cluster.quarkus.openshift.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-25:latest
%openshift-cluster.quarkus.openshift.resources.requests.cpu=100m
%openshift-cluster.quarkus.openshift.resources.requests.memory=256Mi
%openshift-cluster.quarkus.openshift.resources.limits.cpu=1
%openshift-cluster.quarkus.openshift.resources.limits.memory=512Mi
%openshift-cluster.quarkus.openshift.startup-probe.period=10s
%openshift-cluster.quarkus.openshift.startup-probe.failure-threshold=18
%openshift-cluster.quarkus.http.root-path=/ops
# Under the cluster root path the absolute /metrics would sit outside /ops, where the path route
# cannot reach it. Keep the public scrape endpoint under the root path the route carries, and the
# ServiceMonitor Quarkus generates follows this setting.
%openshift-cluster.quarkus.micrometer.export.prometheus.path=/ops/metrics
%openshift-cluster.race-ops.director-enabled=true
# The two specialists run as their own services in the same namespace, so the mesh is reached
# over cluster DNS. No route: only race-ops calls them.
%openshift-cluster.race-ops.mesh-enabled=true
# The specialists' Services publish port 80, not their container ports (8082/8083).
%openshift-cluster.race-ops.analyst.a2a-url=http://race-analyst:80/
%openshift-cluster.race-ops.creative.a2a-url=http://race-creative:80/
# The cluster realm has no direct grants; the director authenticates as a service account.
# The enum value for the client-credentials grant is "client".
%openshift-cluster.quarkus.oidc-client.grant.type=client
# No client secret. The pod runs as the race-ops service account, and Keycloak trusts the token
# OpenShift projects into the pod (scripts/deploy-openshift.sh mounts it and creates the
# federated race-ops client). The client id is left unset on purpose: Keycloak finds the client
# from the token's subject, and a client_id that differs from that subject is rejected.
%openshift-cluster.quarkus.oidc-client.credentials.jwt.source=bearer
%openshift-cluster.quarkus.oidc-client.credentials.jwt.token-path=/var/run/secrets/tokens/token
%openshift-cluster.quarkus.openshift.service-account=race-ops
%openshift-cluster.quarkus.openshift.env.vars.quarkus-profile=openshift-cluster

############## A2A over mTLS (profile mtls, active next to openshift-cluster) ##############
# scripts/deploy-openshift.sh turns this on with A2A_MTLS=true: it runs the app with
# QUARKUS_PROFILE=openshift-cluster,mtls. The SPIFFE sidecar from scripts/mount-spiffe-svid.sh keeps
# the X.509 SVID files in /var/run/secrets/svid, MeshTls makes them the JVM's client certificate,
# and the specialists accept only this app's SPIFFE ID. Their Services still publish port 80.
%mtls.quarkus.openshift.env.vars.quarkus-profile=openshift-cluster,mtls
%mtls.race-ops.mesh-tls.directory=/var/run/secrets/svid
%mtls.race-ops.analyst.a2a-url=https://race-analyst:80/
%mtls.race-ops.creative.a2a-url=https://race-creative:80/

# The MCP client health check bean is excluded: without the OIDC client (no Keycloak until the
# Keycloak configuration step) the admin MCP client cannot initialize, and that is a designed
# degraded state — DirectorHealth reports it to the console and the read-only race client
# still runs. Readiness must not hinge on it. (The extension's own
# quarkus.langchain4j.mcp.health.enabled toggle does not take effect here: the key is shadowed
# by the clients map under the same prefix.)
quarkus.arc.exclude-types=io.quarkiverse.langchain4j.mcp.runtime.McpClientHealthCheck
