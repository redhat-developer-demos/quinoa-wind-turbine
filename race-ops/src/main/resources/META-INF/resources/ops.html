<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>race-ops</title>
  <style>
    :root { color-scheme: dark; }
    body {
      margin: 0; padding: 24px; background: #1c1c1c; color: #eee;
      font: 14px/1.5 ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    }
    h1 { font-size: 1.1rem; letter-spacing: 0.08em; text-transform: uppercase; color: #9ad; margin: 0 0 16px; }
    h1 .dot { color: #6c6; }
    h1 .dot.off { color: #c66; }
    table { border-collapse: collapse; margin-bottom: 24px; }
    th, td { padding: 4px 14px 4px 0; text-align: right; }
    th:first-child, td:first-child { text-align: left; }
    th { color: #888; font-weight: normal; text-transform: uppercase; font-size: 0.75rem; }
    td.rate { color: #9ad; }
    #events { list-style: none; margin: 0; padding: 0; max-width: 60rem; }
    #events li { padding: 3px 0; border-bottom: 1px solid #2e2e2e; white-space: nowrap; }
    #events time { color: #777; margin-right: 12px; }
    #empty { color: #777; }
    .proposal {
      border: 1px solid #9ad; border-radius: 6px; background: #16222c; padding: 12px 16px;
      max-width: 44rem; margin-bottom: 12px;
    }
    .proposal p { margin: 0 0 10px; }
    .proposal button {
      font: inherit; cursor: pointer; border-radius: 4px; border: 1px solid #888;
      background: #2c3e50; color: #eee; padding: 4px 14px; margin-right: 8px;
    }
    .proposal button.approve { border-color: #6c6; color: #6c6; }
    .proposal button:disabled { opacity: 0.5; cursor: default; }
    .proposal .meta { color: #888; font-size: 0.8rem; margin-top: 8px; }
    #recent { list-style: none; padding: 0; max-width: 60rem; color: #999; }
    #recent li { padding: 2px 0; }
    #recent .executed { color: #6c6; }
    #recent .failed { color: #c66; }
  </style>
</head>
<body>
  <h1>race-ops <span id="dot" class="dot off">&#9679;</span></h1>
  <div id="proposals"></div>
  <table>
    <thead>
      <tr><th>team</th><th>pos</th><th>tappers</th><th>active</th><th>stalled</th><th>engagement</th><th>power</th><th>distance</th></tr>
    </thead>
    <tbody id="teams"><tr><td colspan="8" id="empty">waiting for a race snapshot…</td></tr></tbody>
  </table>
  <ul id="events"></ul>
  <ul id="recent"></ul>
  <script>
    const dot = document.getElementById('dot');
    const teamsBody = document.getElementById('teams');
    const eventsList = document.getElementById('events');
    const proposalsDiv = document.getElementById('proposals');
    const recentList = document.getElementById('recent');
    let lastEventAt = 0;

    function renderState(state) {
      const race = state.race || {};
      if (race.engagement && race.engagement.teams && race.engagement.teams.length) {
        teamsBody.innerHTML = race.engagement.teams.map(t => `<tr>
          <td>team ${t.team}</td><td>${t.position}</td><td>${t.tappers}</td>
          <td>${t.active}</td><td>${t.stalled}</td>
          <td class="rate">${Math.round(t.engagementRate * 100)}%</td>
          <td>${t.power}</td><td>${t.distance.toFixed(1)}%</td></tr>`).join('');
      }
      renderProposals(state.pending || []);
      renderRecent(state.recentProposals || []);
    }

    function renderProposals(pending) {
      proposalsDiv.replaceChildren();
      for (const p of pending) {
        proposalsDiv.append(proposalCard(p.proposal));
      }
    }

    // The message and the result come from a model and a tool; they are rendered as text,
    // never as HTML.
    function proposalCard(proposal) {
      const card = document.createElement('div');
      card.className = 'proposal';
      card.dataset.id = proposal.id;
      const message = document.createElement('p');
      message.textContent = proposal.message;
      const approve = document.createElement('button');
      approve.className = 'approve';
      approve.textContent = 'approve';
      approve.onclick = () => decide(proposal.id, 'approve');
      const dismiss = document.createElement('button');
      dismiss.textContent = 'dismiss';
      dismiss.onclick = () => decide(proposal.id, 'dismiss');
      const meta = document.createElement('div');
      meta.className = 'meta';
      meta.textContent = `team ${proposal.team} × ${proposal.multiplier} for ${proposal.seconds}s`;
      card.append(message, approve, dismiss, meta);
      return card;
    }

    function renderRecent(recent) {
      const items = [];
      for (const p of recent) {
        const li = document.createElement('li');
        const meta = `team ${p.proposal.team}, ${p.proposal.type}`;
        if (p.status === 'EXECUTED') {
          li.className = 'executed';
          li.textContent = `approved — ${meta} — ${p.result || ''}`;
        } else if (p.status === 'FAILED') {
          li.className = 'failed';
          li.textContent = `failed — ${meta} — ${p.result || ''}`;
        } else {
          li.textContent = `dismissed — ${meta}${p.result ? ' — ' + p.result : ''}`;
        }
        items.push(li);
      }
      recentList.replaceChildren(...items);
    }

    async function decide(id, action) {
      const card = document.querySelector(`.proposal[data-id="${id}"]`);
      if (card) card.querySelectorAll('button').forEach(b => b.disabled = true);
      try {
        await fetch(`/api/ops/proposals/${id}/${action}`, { method: 'POST' });
      } catch (e) { console.error(e); }
      refresh();
    }

    function renderUpdate(update) {
      dot.classList.remove('off');
      const engagement = update.engagement;
      if (engagement && engagement.teams && engagement.teams.length) {
        teamsBody.innerHTML = engagement.teams.map(t => `<tr>
          <td>team ${t.team}</td><td>${t.position}</td><td>${t.tappers}</td>
          <td>${t.active}</td><td>${t.stalled}</td>
          <td class="rate">${Math.round(t.engagementRate * 100)}%</td>
          <td>${t.power}</td><td>${t.distance.toFixed(1)}%</td></tr>`).join('');
      }
      for (const event of (update.events || []).slice().reverse()) {
        prepend(event);
      }
    }

    function prepend(event) {
      if (event.at <= lastEventAt && eventsList.firstChild) return;
      lastEventAt = Math.max(lastEventAt, event.at);
      const li = document.createElement('li');
      const time = document.createElement('time');
      time.textContent = new Date(event.at).toLocaleTimeString();
      li.append(time, document.createTextNode(event.type + ' — ' + event.detail));
      eventsList.prepend(li);
      while (eventsList.children.length > 50) {
        eventsList.lastChild.remove();
      }
    }

    async function refresh() {
      try {
        const r = await fetch('/api/ops/state');
        renderState(await r.json());
        dot.classList.remove('off');
      } catch (e) {
        dot.classList.add('off');
      }
    }

    refresh();
    setInterval(refresh, 2000);
    const source = new EventSource('/api/ops/stream');
    source.onopen = () => dot.classList.remove('off');
    source.onerror = () => dot.classList.add('off');
    source.onmessage = e => renderUpdate(JSON.parse(e.data));
  </script>
</body>
</html>
