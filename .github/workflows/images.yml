name: Build the GitOps images

# The images the Argo CD deployment runs (sub-task 8, step 5 of the workload identity plan).
# Unlike build.yml — the game's public image pipeline with branch and semver tags — this builds
# all four images for the deploy tree on the gitops-deploy branch: the game with the
# openshift-cluster profile, the three agents with openshift-cluster,mtls (client-auth is
# build-time). After pushing, the update job pins the digests in the overlays' images: blocks.
#
# Pushes made with GITHUB_TOKEN never trigger workflows, so the digest commit cannot loop;
# the path filters keep the builds tied to source changes anyway.
on:
  push:
    branches:
      - gitops-deploy
    paths:
      - 'src/**'
      - 'race-ops/**'
      - 'race-analyst/**'
      - 'race-creative/**'
      - 'pom.xml'
      - '.github/workflows/images.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io

jobs:
  build:
    name: Build ${{ matrix.image }}
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - module: ''
            profile: openshift-cluster
            image: quinoa-wind-turbine
          - module: race-ops/
            profile: openshift-cluster,mtls
            image: race-ops
          - module: race-analyst/
            profile: openshift-cluster,mtls
            image: race-analyst
          - module: race-creative/
            profile: openshift-cluster,mtls
            image: race-creative
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Run tests
        run: ./mvnw -B -f ${{ matrix.module }}pom.xml test

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the image
        run: |
          TAG="git-${GITHUB_SHA::7}"
          ./mvnw -B -f ${{ matrix.module }}pom.xml package \
            -Dquarkus.profile=${{ matrix.profile }} \
            -Dquarkus.container-image.build=true \
            -Dquarkus.container-image.builder=podman \
            -Dquarkus.container-image.push=true \
            -Dquarkus.container-image.registry=${{ env.REGISTRY }} \
            -Dquarkus.container-image.username=${{ github.actor }} \
            -Dquarkus.container-image.password=${{ secrets.GITHUB_TOKEN }} \
            -Dquarkus.container-image.group=${{ github.repository_owner }} \
            -Dquarkus.container-image.name=${{ matrix.image }} \
            -Dquarkus.container-image.tag=$TAG \
            -DskipTests

  pin-digests:
    name: Pin the image digests in the overlays
    needs: build
    runs-on: ubuntu-26.04
    permissions:
      contents: write
      packages: read
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pin the digests
        run: |
          set -euo pipefail
          TAG="git-${GITHUB_SHA::7}"
          : > /tmp/digests
          for image in quinoa-wind-turbine race-ops race-analyst race-creative; do
            digest=$(docker buildx imagetools inspect \
              "${{ env.REGISTRY }}/${{ github.repository_owner }}/$image:$TAG" \
              --format '{{.Manifest.Digest}}')
            echo "$image $digest" | tee -a /tmp/digests
          done
          REGISTRY=${{ env.REGISTRY }} OWNER=${{ github.repository_owner }} \
            python3 - <<'PY'
          import os
          import re

          # The heredoc is flush with the shell on purpose: YAML keeps any extra
          # indentation, and python would read it as a block.
          registry = os.environ["REGISTRY"]
          owner = os.environ["OWNER"]
          digests = dict(line.split() for line in open("/tmp/digests").read().splitlines())
          overlays = ("deploy/overlays/test/kustomization.yaml",
                      "deploy/overlays/openshift-cluster/kustomization.yaml")
          for path in overlays:
              with open(path) as f:
                  text = f.read()
              for name, digest in digests.items():
                  entry = re.escape(f"- name: {registry}/{owner}/{name}")
                  pattern = rf"({entry}\n  digest: )sha256:[0-9a-f]{{64}}"
                  if not re.search(pattern, text):
                      raise SystemExit(f"no images entry for {registry}/{owner}/{name} in {path}")
                  text = re.sub(pattern, rf"\g<1>{digest}", text)
              with open(path, "w") as f:
                  f.write(text)
              print(f"pinned {len(digests)} digests in {path}")
          PY

      - name: Commit the pinned digests
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add deploy/overlays
          git diff --cached --quiet && echo "Digests already pinned" && exit 0
          git commit -m "Pin the GitOps image digests for ${{ github.sha }}"
          git push
