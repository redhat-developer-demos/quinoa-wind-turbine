# The Infinispan credentials, inline for the scratch namespace only: step 4 of the plan
# replaces this with a VaultStaticSecret (and gives the live overlay the same through Vault).
# One secret holds both the identities file the operator reads and the password the app maps
# into INFINISPAN_PASSWORD, from the same value so they cannot drift. The app connects as
# this user; deployer is the least-privilege built-in role with CREATE, which the app needs
# to define the "users" and "races" counters.
apiVersion: v1
kind: Secret
metadata:
  name: infinispan-credentials
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
type: Opaque
stringData:
  username: developer
  password: 54c201d985ab694b
  identities.yaml: |
    credentials:
      - username: developer
        password: 54c201d985ab694b
        roles:
          - deployer
