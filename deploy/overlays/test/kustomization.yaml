apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The verification overlay for the GitOps migration (sub-task 8): same shape as
# openshift-cluster, but in a scratch namespace, so the live demo stays untouched until
# step 9 switches it over. Deleted again once the live namespace runs from Git.
namespace: wind-turbine-gitops

resources:
- ../../base
- namespace.yaml

# The images the Deployments (step 6) run, pinned by .github/workflows/images.yml to the
# digest it pushed for the gitops-deploy head; do not edit the digests by hand. Until the
# Deployments exist this block matches nothing and changes no resource.
images:
- name: ghcr.io/redhat-developer-demos/quinoa-wind-turbine
  digest: sha256:003969a9471f323182c5b47fdcb6a5f60906577424a28aff7ac3b71e96cc2769
- name: ghcr.io/redhat-developer-demos/race-ops
  digest: sha256:9b739707002604d8c8af77c821ef9d3a1fe20d15e7d568c082076af7799fbd28
- name: ghcr.io/redhat-developer-demos/race-analyst
  digest: sha256:3e147bcf999f5042b68fb489845a2d8704fef3eeeeb14efdf8a8dd2731482a4f
- name: ghcr.io/redhat-developer-demos/race-creative
  digest: sha256:5c7a894d958e145ddbc4486c3d85800b45344fc79caafeb882a3fea50e7dfee4

patches:
# Pin both routes to the host OpenShift assigns the game route in this namespace.
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: quinoa-wind-turbine
  patch: |-
    - op: add
      path: /spec/host
      value: quinoa-wind-turbine-wind-turbine-gitops.apps.cluster-dnw9g.dyn.redhatworkshops.io
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: race-ops
  patch: |-
    - op: add
      path: /spec/host
      value: quinoa-wind-turbine-wind-turbine-gitops.apps.cluster-dnw9g.dyn.redhatworkshops.io
