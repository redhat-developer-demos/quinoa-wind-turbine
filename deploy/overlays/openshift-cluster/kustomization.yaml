apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The live demo namespace. Argo CD owns it from step 9 on; before that the cluster ran from
# scripts/deploy-openshift.sh, which now only serves as the fallback.
namespace: wind-turbine

resources:
- ../../base
- namespace.yaml

# The images the Deployments run, pinned by .github/workflows/images.yml to the digest it
# pushed for the gitops-deploy head; do not edit the digests by hand.
images:
- name: ghcr.io/redhat-developer-demos/quinoa-wind-turbine
  digest: sha256:f4b24043d7d9bd35ea96b55fa90a52c6203a82fbae071a95be1583f2ad7b4087
- name: ghcr.io/redhat-developer-demos/race-ops
  digest: sha256:5a8ef9d63bdee8ee9e9393f1fb7ca0c517054e73a637982d8e97b015fba025ad
- name: ghcr.io/redhat-developer-demos/race-analyst
  digest: sha256:92eb7fa7e5f0fd461652daf97579f342e5040a04de5ebe48d32e767b3c81b72f
- name: ghcr.io/redhat-developer-demos/race-creative
  digest: sha256:d5744e11113f55161905eaacb695b567bad26e7e5de8b31fb31b1ddf4e55ff6b

patches:
# Pin both routes to the host the game route already uses, so the race-ops console
# path-route works on the game's host (see base/routes.yaml).
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: quinoa-wind-turbine
  patch: |-
    - op: add
      path: /spec/host
      value: quinoa-wind-turbine-wind-turbine.apps.cluster-dnw9g.dyn.redhatworkshops.io
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: race-ops
  patch: |-
    - op: add
      path: /spec/host
      value: quinoa-wind-turbine-wind-turbine.apps.cluster-dnw9g.dyn.redhatworkshops.io

# The game's browser login and the audience the admin MCP tools check.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: quinoa-wind-turbine
    spec:
      template:
        spec:
          containers:
          - name: quinoa-wind-turbine
            env:
            - name: GAME_OIDC_ENABLED
              value: "true"
            - name: GAME_OIDC_URL
              value: https://sso.apps.cluster-dnw9g.dyn.redhatworkshops.io/realms/wind-turbine

# The director authenticates to Keycloak with a SPIFFE JWT-SVID, and reaches both MCP servers
# on the game's route (source-balanced, so a session stays on one of the five pods).
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: race-ops
    spec:
      template:
        spec:
          initContainers:
          - name: svid-init
            env:
            - name: AUDIENCE
              value: https://sso.apps.cluster-dnw9g.dyn.redhatworkshops.io/realms/wind-turbine
            command: ["sh", "-c", "for i in $(seq 1 60); do sh /scripts/fetch-x509.sh && sh /scripts/fetch-jwt.sh && exit 0; sleep 2; done; echo no SVID >&2; exit 1"]
          containers:
          - name: race-ops
            env:
            - name: QUARKUS_LANGCHAIN4J_MCP_RACE_URL
              value: https://quinoa-wind-turbine-wind-turbine.apps.cluster-dnw9g.dyn.redhatworkshops.io/mcp
            - name: QUARKUS_LANGCHAIN4J_MCP_RACE_ADMIN_URL
              value: https://quinoa-wind-turbine-wind-turbine.apps.cluster-dnw9g.dyn.redhatworkshops.io/admin/mcp
            - name: QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL
              value: https://sso.apps.cluster-dnw9g.dyn.redhatworkshops.io/realms/wind-turbine
            - name: QUARKUS_OIDC_CLIENT_CLIENT_ID
              value: spiffe://apps.cluster-dnw9g.dyn.redhatworkshops.io/ns/wind-turbine/sa/race-ops
            - name: QUARKUS_OIDC_CLIENT_CREDENTIALS_JWT_SOURCE
              value: spiffe-jwt
            - name: QUARKUS_OIDC_CLIENT_CREDENTIALS_JWT_TOKEN_PATH
              value: /var/run/secrets/svid/jwt_svid.token
            # The mesh calls the specialists by name; the JWT/X.509 SVIDs carry the pod's
            # fully qualified DNS names, not the bare service name, so the short form fails
            # hostname verification (No name matching race-analyst found).
            - name: RACE_OPS_ANALYST_A2A_URL
              value: https://race-analyst.wind-turbine.svc:80/
            - name: RACE_OPS_CREATIVE_A2A_URL
              value: https://race-creative.wind-turbine.svc:80/
          - name: svid-refresh
            env:
            - name: AUDIENCE
              value: https://sso.apps.cluster-dnw9g.dyn.redhatworkshops.io/realms/wind-turbine
            command: ["sh", "-c", "while true; do sh /scripts/fetch-x509.sh && sh /scripts/fetch-jwt.sh && sleep 60 || sleep 5; done"]

# The creative director authenticates with its service account's projected token, whose
# audience is the realm (the image's %openshift-cluster profile reads
# /var/run/secrets/tokens/token). It calls the game's admin MCP server on the route.
- patch: |-
    apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: race-creative
    spec:
      template:
        spec:
          volumes:
          - name: keycloak-token
            projected:
              sources:
              - serviceAccountToken:
                  audience: https://sso.apps.cluster-dnw9g.dyn.redhatworkshops.io/realms/wind-turbine
                  expirationSeconds: 600
                  path: token
          containers:
          - name: race-creative
            volumeMounts:
            - name: keycloak-token
              mountPath: /var/run/secrets/tokens
              readOnly: true
            env:
            - name: QUARKUS_LANGCHAIN4J_MCP_RACE_ADMIN_URL
              value: https://quinoa-wind-turbine-wind-turbine.apps.cluster-dnw9g.dyn.redhatworkshops.io/admin/mcp
            - name: QUARKUS_OIDC_CLIENT_AUTH_SERVER_URL
              value: https://sso.apps.cluster-dnw9g.dyn.redhatworkshops.io/realms/wind-turbine
            - name: QUARKUS_OIDC_CLIENT_CLIENT_ID
              value: system:serviceaccount:wind-turbine:race-creative
