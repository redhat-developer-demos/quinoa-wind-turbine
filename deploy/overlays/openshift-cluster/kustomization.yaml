apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# The live demo namespace. Until sub-task 8 step 9, the cluster runs from
# scripts/deploy-openshift.sh; this overlay is what Argo CD will own once it switches.
namespace: wind-turbine

resources:
- ../../base
- namespace.yaml

# The images the Deployments (step 6) run, pinned by .github/workflows/images.yml to the
# digest it pushed for the gitops-deploy head; do not edit the digests by hand.
images:
- name: ghcr.io/redhat-developer-demos/quinoa-wind-turbine
  digest: sha256:6590b2a010d18bd40cf11417b14b19affd067fd066a3929311cfaee2f1d4423a
- name: ghcr.io/redhat-developer-demos/race-ops
  digest: sha256:b85c283b7e46ef07c028dec796946af920904dcb32d9a6e08161b86a44f55924
- name: ghcr.io/redhat-developer-demos/race-analyst
  digest: sha256:903a869dfd86fe9f1b2e544fcf099830c95bbd9e146b443493333de2ebabae68
- name: ghcr.io/redhat-developer-demos/race-creative
  digest: sha256:63d7c58e19c737a665e05a59b7c260c032b2c6112eb3ed3c110c8caa20a83891

patches:
# Pin both routes to the host OpenShift assigns the game route in this namespace, so the
# race-ops console path-routes on the game's host (see base/routes.yaml).
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: quinoa-wind-turbine
  patch: |-
    - op: add
      path: /spec/host
      value: quinoa-wind-turbine-wind-turbine.apps.cluster-dnw9g.dyn.redhatworkshops.io
- target:
    group: route.openshift.io
    version: v1
    kind: Route
    name: race-ops
  patch: |-
    - op: add
      path: /spec/host
      value: quinoa-wind-turbine-wind-turbine.apps.cluster-dnw9g.dyn.redhatworkshops.io
