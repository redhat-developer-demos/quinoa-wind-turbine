# The master realm's initial admin credentials for the Keycloak configuration hook (see
# keycloak-hook.yaml), harvested from the live cluster by scripts/seed-vault.sh. The Keycloak
# URL is the shared instance's public route, with a public certificate, so the hook verifies
# TLS normally.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: keycloak-admin
spec:
  vaultAuthRef: vault-auth
  type: kv-v2
  mount: secret
  path: wind-turbine/keycloak-admin
  hmacSecretData: true
  refreshAfter: 300s
  destination:
    create: true
    name: keycloak-admin
