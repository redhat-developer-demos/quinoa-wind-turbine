# One service account per agent: Keycloak maps each federated client to one service
# account subject and warns against sharing the namespace default, and SPIRE issues each
# agent an identity of its own. The game itself runs as the namespace default.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: race-ops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: race-analyst
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: race-creative
