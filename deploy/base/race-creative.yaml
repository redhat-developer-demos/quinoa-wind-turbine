# The creative director. Like the analyst: the mtls profile is mandatory (the image cannot
# boot without TLS), the SVID files come from the init container and sidecar (see svid.yaml),
# and CallerAllowList admits only race-ops' SPIFFE ID — the base value names the live
# namespace; the test overlay patches it to its own. No OIDC yet (step 8): its admin MCP
# client cannot authenticate and proposals fall back to the preset rotation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: race-creative
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: race-creative
  template:
    metadata:
      labels:
        app: race-creative
    spec:
      serviceAccountName: race-creative
      volumes:
      # The Workload API socket, through the SPIFFE CSI driver.
      - name: spiffe-workload-api
        csi:
          driver: csi.spiffe.io
          readOnly: true
      # The SVID files, in memory: nothing touches a disk.
      - name: svid
        emptyDir:
          medium: Memory
      - name: svid-script
        configMap:
          name: svid-fetch
      initContainers:
      - name: svid-init
        # Same image as the sidecar; see svid.yaml for why.
        image: registry.redhat.io/zero-trust-workload-identity-manager/spiffe-spire-agent-rhel9@sha256:6f9fedc33a341ad6f59b0023241e27134797caa102704497a21e492f441413fe
        command: ["sh", "-c", "for i in $(seq 1 60); do sh /scripts/fetch-x509.sh && exit 0; sleep 2; done; echo no SVID >&2; exit 1"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
        - name: svid
          mountPath: /svid
        - name: svid-script
          mountPath: /scripts
          readOnly: true
      containers:
      - name: race-creative
        # The tag is a placeholder: the overlays' images block pins the digest that
        # .github/workflows/images.yml pushed.
        image: ghcr.io/redhat-developer-demos/race-creative:latest
        ports:
        - name: http
          containerPort: 8083
        env:
        - name: QUARKUS_PROFILE
          value: openshift-cluster,mtls
        - name: A2A_ALLOWED_CALLER
          value: spiffe://apps.cluster-dnw9g.dyn.redhatworkshops.io/ns/wind-turbine/sa/race-ops
        - name: RACE_CREATIVE_AI_ENABLED
          value: "true"
        envFrom:
        # The model credentials for the theme proposals; optional, like the game's.
        - secretRef:
            name: commentary-openai
            optional: true
        volumeMounts:
        - name: svid
          mountPath: /var/run/secrets/svid
          readOnly: true
        # Health on the management interface (port 9000): the main port requires a client
        # certificate, which kubelet cannot present.
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 9000
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 9000
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 9000
          periodSeconds: 10
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: "1"
            memory: 512Mi
      # Keeps the SVID files current: an X.509 SVID lives an hour and renews at half-life.
      - name: svid-refresh
        image: registry.redhat.io/zero-trust-workload-identity-manager/spiffe-spire-agent-rhel9@sha256:6f9fedc33a341ad6f59b0023241e27134797caa102704497a21e492f441413fe
        command: ["sh", "-c", "while true; do sh /scripts/fetch-x509.sh && sleep 60 || sleep 5; done"]
        resources:
          requests:
            cpu: 10m
            memory: 16Mi
          limits:
            memory: 64Mi
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        volumeMounts:
        - name: spiffe-workload-api
          mountPath: /spiffe-workload-api
          readOnly: true
        - name: svid
          mountPath: /svid
        - name: svid-script
          mountPath: /scripts
          readOnly: true
---
apiVersion: v1
kind: Service
metadata:
  name: race-creative
spec:
  selector:
    app: race-creative
  ports:
  - name: http
    port: 80
    targetPort: 8083
