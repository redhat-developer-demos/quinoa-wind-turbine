# The game's secrets, synced from Vault KV (secret/wind-turbine/*, seeded by
# scripts/seed-vault.sh) by the Vault Secrets Operator. The keys match what
# scripts/deploy-openshift.sh creates, so a deployment cannot tell the two apart. commentary-
# openai is optional: when Vault holds no values for it (a fresh deployment without a model),
# its sync fails harmlessly and the game runs without AI commentary.
#
# The game-admin secret also has to exist in the keycloak namespace for the realm import;
# that second VaultStaticSecret belongs to the live overlay (step 9), because writing into
# the live keycloak namespace from the test app would touch live infrastructure.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: game-admin
spec:
  vaultAuthRef: vault-auth
  type: kv-v2
  mount: secret
  path: wind-turbine/game-admin
  hmacSecretData: true
  refreshAfter: 300s
  destination:
    create: true
    name: game-admin
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: game-session
spec:
  vaultAuthRef: vault-auth
  type: kv-v2
  mount: secret
  path: wind-turbine/game-session
  hmacSecretData: true
  refreshAfter: 300s
  destination:
    create: true
    name: game-session
---
# Replaces the test overlay's former inline secret: the values live in Vault, and the
# Infinispan CR (deploy/base/infinispan.yaml) reads this secret as its endpointSecretName.
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: infinispan-credentials
spec:
  vaultAuthRef: vault-auth
  type: kv-v2
  mount: secret
  path: wind-turbine/infinispan-credentials
  hmacSecretData: true
  refreshAfter: 300s
  destination:
    create: true
    name: infinispan-credentials
---
apiVersion: secrets.hashicorp.com/v1beta1
kind: VaultStaticSecret
metadata:
  name: commentary-openai
spec:
  vaultAuthRef: vault-auth
  type: kv-v2
  mount: secret
  path: wind-turbine/commentary-openai
  hmacSecretData: true
  refreshAfter: 300s
  destination:
    create: true
    name: commentary-openai
