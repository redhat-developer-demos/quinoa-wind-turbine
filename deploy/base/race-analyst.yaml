# The engagement analyst. Step 6 of the GitOps migration: QUARKUS_PROFILE is openshift-cluster,
# not openshift-cluster,mtls, so the server listens in plain HTTP and race-ops's mesh URLs in
# the openshift-cluster profile reach it; the mTLS wiring (SVID volume, allowed-caller env)
# arrives with the SVID components in step 7. No secrets, no model: this app is plain code.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: race-analyst
  annotations:
    argocd.argoproj.io/sync-wave: "10"
spec:
  replicas: 1
  selector:
    matchLabels:
      app: race-analyst
  template:
    metadata:
      labels:
        app: race-analyst
    spec:
      serviceAccountName: race-analyst
      containers:
      - name: race-analyst
        # The tag is a placeholder: the overlays' images block pins the digest that
        # .github/workflows/images.yml pushed.
        image: ghcr.io/redhat-developer-demos/race-analyst:latest
        ports:
        - name: http
          containerPort: 8082
        env:
        - name: QUARKUS_PROFILE
          value: openshift-cluster
        # Health on the management interface (port 9000): the main port requires a client
        # certificate under the mtls profile, which kubelet cannot present.
        startupProbe:
          httpGet:
            path: /q/health/started
            port: 9000
          periodSeconds: 5
          failureThreshold: 36
        livenessProbe:
          httpGet:
            path: /q/health/live
            port: 9000
          periodSeconds: 10
        readinessProbe:
          httpGet:
            path: /q/health/ready
            port: 9000
          periodSeconds: 10
        resources:
          requests:
            cpu: 50m
            memory: 192Mi
          limits:
            cpu: 500m
            memory: 384Mi
---
apiVersion: v1
kind: Service
metadata:
  name: race-analyst
spec:
  selector:
    app: race-analyst
  ports:
  - name: http
    port: 80
    targetPort: 8082
