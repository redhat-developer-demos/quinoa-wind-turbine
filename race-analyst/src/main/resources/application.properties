quarkus.application.name=race-analyst

# The A2A endpoint is the root path: JSON-RPC on POST /, the card on
# GET /.well-known/agent-card.json. race-ops calls this over A2A; nothing else does.
quarkus.http.port=8082

a2a.agent.version=1.0.0
a2a.agent.url=http://localhost:8082/
analyst.a2a.agent.name=Race Analyst
analyst.a2a.agent.description=Reads race snapshots and explains why a team is behind: how many \
  players still tap, how many stopped, and how much power each tap buys.

# A request is a couple of snapshots, so the default limits are generous already. Keep the
# body cap explicit: a caller sending a whole race history should fail fast, not buffer it.
quarkus.http.limits.max-body-size=2M

# The SDK fails closed on every operation unless a TaskAuthorizationProvider is configured.
# This app has none, on purpose: it holds no state of its own and only race-ops can reach it
# (cluster-internal service, no route). Without this, every call answers "Task not found".
a2a.authorization.required=false

%test.quarkus.http.test-port=0

############## Cluster deployment ##############
# One replica, no route: only race-ops reaches it, over the cluster service DNS. The container
# listens on 8082; the Service publishes it on 80, which is what the URLs below use.

%openshift-cluster.quarkus.kubernetes.deployment-target=openshift
%openshift-cluster.quarkus.openshift.deployment-kind=Deployment
%openshift-cluster.quarkus.openshift.replicas=1
%openshift-cluster.quarkus.openshift.route.expose=false
%openshift-cluster.quarkus.openshift.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-25:latest
%openshift-cluster.quarkus.openshift.resources.requests.cpu=50m
%openshift-cluster.quarkus.openshift.resources.requests.memory=192Mi
%openshift-cluster.quarkus.openshift.resources.limits.cpu=500m
%openshift-cluster.quarkus.openshift.resources.limits.memory=384Mi
%openshift-cluster.quarkus.openshift.startup-probe.period=10s
%openshift-cluster.quarkus.openshift.startup-probe.failure-threshold=18
%openshift-cluster.quarkus.openshift.env.vars.quarkus-profile=openshift-cluster
# Quarkus publishes the Service on port 80 (there is no service-port setting in 3.40), so the
# card and the caller agree on that port; the container still listens on 8082.
%openshift-cluster.a2a.agent.url=http://race-analyst:80/
