quarkus.application.name=race-creative

# The A2A endpoint is the root path: JSON-RPC on POST /, the card on
# GET /.well-known/agent-card.json. race-ops calls this over A2A; nothing else does.
quarkus.http.port=8083

a2a.agent.version=1.0.0
a2a.agent.url=http://localhost:8083/
creative.a2a.agent.name=Race Creative Director
creative.a2a.agent.description=Proposes the next heat's theme and team names, and executes an \
  approved brief through the game's own AI theme tools.

# The SDK fails closed on every operation unless a TaskAuthorizationProvider is configured.
# This app has none: it only reaches the game through its own admin-scoped MCP client, and only
# race-ops can reach this endpoint (cluster-internal service, no route).
a2a.authorization.required=false

# The game's admin MCP server: the theme tools only, behind OIDC. Health checks run without the
# auth token, so they are off to avoid reconnect churn against the token-gated endpoint.
quarkus.langchain4j.mcp.race-admin.transport-type=streamable-http
quarkus.langchain4j.mcp.race-admin.url=http://localhost:8080/admin/mcp
# Pin the protocol the game speaks, 2026-07-28: stateless requests, no session and no
# initialization handshake. Without the pin the first tool call spends 30 s probing for it, and
# race-ops only waits 40 s for the whole proposal.
quarkus.langchain4j.mcp.race-admin.protocol-version=2026-07-28
quarkus.langchain4j.mcp.race-admin.auto-health-check=false

# Dev token: the same direct grant race-ops uses against the game's dev Keycloak. Scoped to %dev
# so a deployment without its own credentials fails closed. A deployment sets
# QUARKUS_OIDC_CLIENT_* for the race-ops confidential client, whose service account is admin.
%dev.quarkus.oidc-client.auth-server-url=http://localhost:8181/realms/wind-turbine
%dev.quarkus.oidc-client.client-id=mcp-agent
%dev.quarkus.oidc-client.grant.type=password
%dev.quarkus.oidc-client.grant-options.password.username=developer
%dev.quarkus.oidc-client.grant-options.password.password=developer

# The model that picks the proposal shape and shapes the brief. Off by default so no test run
# touches a model; when off, proposals fall back to a deterministic preset pick.
race-creative.ai-enabled=false
%dev.race-creative.ai-enabled=true
quarkus.langchain4j.openai.enable-integration=${race-creative.ai-enabled}
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:unused}
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.enmaas.devshift.net/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:rits/zai-org/glm-5-3}
quarkus.langchain4j.openai.timeout=15s
quarkus.langchain4j.openai.chat-model.max-completion-tokens=512
quarkus.langchain4j.openai.chat-model.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
quarkus.langchain4j.openai.max-retries=1

# Tests never talk to a server: the MCP client stops health-checking an unreachable URL, and the
# OIDC client gets dummy credentials (never used) so it can be created at startup.
%test.quarkus.langchain4j.mcp.race-admin.url=http://127.0.0.1:1/admin/mcp
%test.quarkus.langchain4j.mcp.race-admin.auto-health-check=false
%test.quarkus.oidc-client.auth-server-url=http://127.0.0.1:1/realms/wind-turbine
%test.quarkus.oidc-client.client-id=test
%test.quarkus.oidc-client.grant.type=client
%test.quarkus.oidc-client.credentials.secret=test

# When the game or its Keycloak is unreachable, one readable failure beats a stack trace per
# connection retry.
quarkus.log.category."io.quarkus.oidc.client.runtime.OidcClientImpl".level=OFF
quarkus.log.category."io.quarkus.oidc.common.runtime.OidcCommonUtils".level=OFF

############## Cluster deployment ##############
# One replica, no route: only race-ops reaches it, over the cluster service DNS. The container
# listens on 8083; the Service publishes it on 80, which is what the advertised card uses.

%openshift-cluster.quarkus.kubernetes.deployment-target=openshift
%openshift-cluster.quarkus.openshift.deployment-kind=Deployment
%openshift-cluster.quarkus.openshift.replicas=1
%openshift-cluster.quarkus.openshift.route.expose=false
%openshift-cluster.quarkus.openshift.base-jvm-image=registry.access.redhat.com/ubi9/openjdk-25:latest
%openshift-cluster.quarkus.openshift.resources.requests.cpu=100m
%openshift-cluster.quarkus.openshift.resources.requests.memory=256Mi
%openshift-cluster.quarkus.openshift.resources.limits.cpu=1
%openshift-cluster.quarkus.openshift.resources.limits.memory=512Mi
%openshift-cluster.quarkus.openshift.startup-probe.period=10s
%openshift-cluster.quarkus.openshift.startup-probe.failure-threshold=18
%openshift-cluster.quarkus.openshift.env.vars.quarkus-profile=openshift-cluster
# The game's admin MCP server. The deploy script overrides this with the game's route, because
# the Service round-robins over five pods and an MCP session only exists on the pod that opened
# it; the route is source-balanced and keeps the caller on one pod. This value is the fallback
# for a build that skips the script.
%openshift-cluster.quarkus.langchain4j.mcp.race-admin.url=http://quinoa-wind-turbine:8080/admin/mcp
# Same confidential client as race-ops: its service account already holds the admin role, so no
# second Keycloak client is needed.
%openshift-cluster.quarkus.oidc-client.client-id=race-ops
%openshift-cluster.quarkus.oidc-client.grant.type=client
%openshift-cluster.quarkus.openshift.env.mapping.quarkus-oidc-client-credentials-secret.from-secret=race-ops-client
%openshift-cluster.quarkus.openshift.env.mapping.quarkus-oidc-client-credentials-secret.with-key=secret
# The model endpoint comes from the same commentary-openai secret race-ops and the game mount, and
# the deploy script turns the model on only when that secret exists: without it the app still boots
# and proposes presets. So ai-enabled stays false here and arrives as RACE_CREATIVE_AI_ENABLED=true.
# Quarkus publishes the Service on port 80 (there is no service-port setting in 3.40), so the
# advertised card URL is the Service's; the container still listens on 8083.
%openshift-cluster.a2a.agent.url=http://race-creative:80/
