quarkus.micrometer.export.prometheus.path=/metrics

quarkus.quinoa.enable-spa-routing=true
# SPA routing answers unknown paths with index.html. MCP clients look up /.well-known/* to find out whether
# a server needs a login, and they need a 404 there, not HTML. Setting this replaces Quinoa's defaults, so
# the REST and management paths are listed too.
quarkus.quinoa.ignored-path-prefixes=/api,/q,/.well-known
quarkus.quinoa.package-manager-install=true
# Vite 8 needs Node 20.19+ or 22.12+
quarkus.quinoa.package-manager-install.node-version=22.12.0
quarkus.quinoa.package-manager-install.npm-version=10.9.0

quarkus.container-image.registry=quay.io
quarkus.container-image.group=kdubois
quarkus.container-image.tag=1.0
# Builds images inside OpenShift. The GitHub workflow has no cluster, so it overrides this with podman.
quarkus.container-image.builder=openshift

quarkus.native.resources.includes=names
quarkus.rest.path=/api

# Shared by the player UI, dashboard and template/AI commentary. Team IDs remain 1 and 2.
game.teams.1.name=Mountains
game.teams.1.color=grey
game.teams.1.car=car-orange
game.teams.2.name=Beach
game.teams.2.color=skyblue
game.teams.2.car=car-blue-convertible

# Use BASIC client intelligence to avoid topology issues with dev services
quarkus.infinispan-client.client-intelligence=BASIC

quarkus.http.filter.others.header.Cache-Control=no-cache
quarkus.http.filter.others.matches=/.*
quarkus.http.filter.others.methods=GET
quarkus.http.filter.others.order=0
quarkus.http.filter.static.header.Cache-Control=max-age=31536000
quarkus.http.filter.static.matches=/static/.+
quarkus.http.filter.static.methods=GET
quarkus.http.filter.static.order=1

quarkus.http.auth.form.enabled=true
quarkus.http.auth.policy.admin-policy.roles-allowed=admin
# The dashboard and its endpoints use form login. With OIDC on the classpath, naming the mechanism keeps
# anonymous requests redirecting to the login page instead of getting the bearer 401.
quarkus.http.auth.permission.admin-permission.paths=/dashboard,/ws/dashboard,/api/game/event,/api/power/stream
quarkus.http.auth.permission.admin-permission.policy=admin-policy
quarkus.http.auth.permission.admin-permission.auth-mechanism=form
quarkus.http.auth.form.login-page=/login
quarkus.http.auth.form.error-page=/login-error
quarkus.http.auth.form.landing-page=/
# Dashboard login, checked by AdminIdentityProvider. Set GAME_ADMIN_USERNAME and GAME_ADMIN_PASSWORD
# to change it. Without GAME_ADMIN_PASSWORD, the login is checked against this digest of the
# developer user's password, which deployments from the software template rely on.
game.admin.password-digest=e2bd743079c4c51ddcc22dde218a2e534145f9aa
%dev,test.game.admin.password=developer
quarkus.http.auth.form.new-cookie-interval=PT5H
quarkus.http.auth.form.timeout=PT5H

############## MCP server ##############
# /mcp only reads the race and needs no login. /admin/mcp also controls the race and needs a bearer
# token with the admin role. It is guarded by an HTTP permission rather than @RolesAllowed, because MCP
# clients only start their OAuth login when they get a 401.
quarkus.mcp.server.server-info.name=Wind turbine race
quarkus.mcp.server.admin.server-info.name=Wind turbine race control
quarkus.mcp.server.admin.http.root-path=/admin/mcp
quarkus.http.auth.permission.mcp-admin.paths=/admin/mcp,/admin/mcp/*
quarkus.http.auth.permission.mcp-admin.policy=mcp-admin
quarkus.http.auth.permission.mcp-admin.auth-mechanism=bearer

############## OIDC (MCP admin tokens) ##############
# OIDC is optional in every mode. Enable it for admin MCP with GAME_OIDC_ENABLED=true.
# Dev Services imports the local realm only when OIDC is enabled; production also needs GAME_OIDC_URL.
quarkus.oidc.tenant-enabled=${GAME_OIDC_ENABLED:false}
# Dev mode enables it by default, so admin MCP works locally with Keycloak Dev Services.
%dev.quarkus.oidc.tenant-enabled=${GAME_OIDC_ENABLED:true}
quarkus.keycloak.devservices.enabled=${quarkus.oidc.tenant-enabled}
quarkus.oidc.application-type=service
quarkus.oidc.client-id=wind-turbine
quarkus.oidc.token.audience=wind-turbine
quarkus.oidc.resource-metadata.enabled=true
quarkus.oidc.resource-metadata.resource=admin/mcp
# Locally the app runs on plain http. On the cluster the route terminates TLS, so the metadata keeps https.
%dev,test.quarkus.oidc.resource-metadata.force-https-scheme=false
quarkus.keycloak.devservices.realm-path=keycloak/wind-turbine-realm.json
quarkus.keycloak.devservices.realm-name=wind-turbine
%dev.quarkus.keycloak.devservices.port=8181
# Each deployment profile supplies the external realm URL when OIDC is enabled.
%prod,openshift-cluster,openshift-sandbox,confluent.quarkus.oidc.auth-server-url=${GAME_OIDC_URL:http://localhost:8180/realms/wind-turbine}

############## WebSockets ##############
# Pings keep quiet connections open, since the HTTP idle timeout below closes them after 30 seconds
quarkus.websockets-next.server.auto-ping-interval=10s
quarkus.websockets-next.server.metrics.enabled=true

# Graceful shutdown configuration to reduce shutdown errors
quarkus.shutdown.timeout=PT30S
quarkus.http.idle-timeout=PT30S
# The Vite HMR socket that Quinoa proxies in dev mode has no pings, and Vite reloads every open page when it
# reconnects, which sends the phones back to the team choice
%dev.quarkus.http.idle-timeout=PT1H

############## Kafka ##############
# One consumer generates commentary; every replica receives its published lines.
mp.messaging.incoming.commentary-race-in.topic=race-progress
mp.messaging.incoming.commentary-race-in.group.id=wind-turbine-commentator
mp.messaging.incoming.commentary-race-in.auto.offset.reset=latest
mp.messaging.incoming.commentary-race-in.consumer-rebalance-listener.name=commentary
mp.messaging.outgoing.commentary-out.topic=race-commentary
mp.messaging.incoming.commentary-in.topic=race-commentary
mp.messaging.incoming.commentary-in.group.id=commentary-${quarkus.uuid}
mp.messaging.incoming.commentary-in.auto.offset.reset=earliest
mp.messaging.incoming.power-in.topic=power
mp.messaging.incoming.power-in.group.id=${quarkus.uuid}
mp.messaging.outgoing.power-out.topic=power
mp.messaging.outgoing.power-out.merge=true
mp.messaging.incoming.game-events-in.topic=game-events
mp.messaging.incoming.game-events-in.group.id=${quarkus.uuid}
# Tests send game events right after startup, before this consumer has its partition. Reading from the
# start keeps those events instead of skipping them.
%test.mp.messaging.incoming.game-events-in.auto.offset.reset=earliest
mp.messaging.outgoing.game-events-out.topic=game-events
mp.messaging.incoming.race-progress-in.topic=race-progress
mp.messaging.incoming.race-progress-in.group.id=${quarkus.uuid}
# Each replica reads race-progress from the start to rebuild its copy of the current race
mp.messaging.incoming.race-progress-in.auto.offset.reset=earliest
# Kafka Dev Services - use official Apache Kafka image
quarkus.kafka.devservices.provider=upstream-kafka
quarkus.kafka.devservices.topic-partitions.power=1
quarkus.kafka.devservices.topic-partitions.game-events=1
quarkus.kafka.devservices.topic-partitions.race-progress=1
quarkus.kafka.devservices.topic-partitions.race-commentary=1

# kafka.bootstrap.servers=pkc-921jm.us-east-2.aws.confluent.cloud:9092
# kafka.security.protocol=SASL_SSL
# kafka.sasl.mechanism=PLAIN
# kafka.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="" password="";


# Kafka graceful shutdown
mp.messaging.incoming.power-in.graceful-shutdown=true
mp.messaging.incoming.game-events-in.graceful-shutdown=true
mp.messaging.incoming.race-progress-in.graceful-shutdown=true

############## Race (Kafka Streams) ##############
# Keep game.tap-power in sync with TAP_POWER in src/main/webui/src/Config.js
game.tap-power=15
game.taps-needed-per-player=100
game.race.snapshot-interval=250ms
quarkus.kafka-streams.topics=power,game-events
kafka-streams.commit.interval.ms=1000
kafka-streams.deserialization.exception.handler=org.apache.kafka.streams.errors.LogAndContinueExceptionHandler

############## Race commentary ##############
game.ai.enabled=false
quarkus.langchain4j.devservices.enabled=false
quarkus.langchain4j.openai.enable-integration=${game.ai.enabled}
# The placeholder lets the default template-only build start without credentials.
quarkus.langchain4j.openai.api-key=${OPENAI_API_KEY:unused}
quarkus.langchain4j.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1/}
quarkus.langchain4j.openai.chat-model.model-name=${OPENAI_MODEL:gpt-6-luna}
quarkus.langchain4j.openai.timeout=${game.commentary.timeout:2s}
quarkus.langchain4j.openai.max-retries=1
quarkus.langchain4j.openai.chat-model.max-completion-tokens=256
quarkus.langchain4j.openai.chat-model.reasoning-effort=${OPENAI_REASONING_EFFORT:none}
quarkus.langchain4j.openai.log-requests=false
quarkus.langchain4j.openai.log-responses=false

############## Shared OpenShift deployment settings ##############
# Applied to every deployment profile. Each provider profile below adds only what differs. A named
# build profile replaces prod rather than inheriting it, so shared settings list each profile.
%openshift-cluster,openshift-sandbox,confluent.quarkus.kubernetes.deployment-target=openshift
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.deployment-kind=Deployment
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.route.expose=true

# Bake the matching runtime profile into the generated Deployment, so a Confluent deployment runs as
# confluent and a Strimzi deployment as openshift-cluster. The packaged app defaults to prod at
# runtime otherwise, because a named build profile does not set the runtime default.
%openshift-cluster.quarkus.openshift.env.vars.quarkus-profile=openshift-cluster
%openshift-sandbox.quarkus.openshift.env.vars.quarkus-profile=openshift-sandbox
%confluent.quarkus.openshift.env.vars.quarkus-profile=confluent

# Infinispan client, shared across providers. The password comes from the infinispan-credentials
# secret that src/main/kubernetes/infinispan/infinispan.yaml creates, so it doesn't depend on the
# operator-generated secret. Override infinispan-host, infinispan-username and this secret to reuse an
# existing Infinispan service.
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.env.mapping.infinispan-password.from-secret=infinispan-credentials
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.env.mapping.infinispan-password.with-key=password
%openshift-cluster,openshift-sandbox,confluent.quarkus.infinispan-client.server-list=${infinispan-host:infinispan}:11222
%openshift-cluster,openshift-sandbox,confluent.quarkus.infinispan-client.auth-username=${infinispan-username:developer}
%openshift-cluster,openshift-sandbox,confluent.quarkus.infinispan-client.auth-password=${infinispan-password}

# Dashboard password from the game-admin secret, which replaces the digest fallback above. Kept in the
# deployment so a redeploy preserves it. src/main/kubernetes/secrets.yaml creates the secret.
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.env.mapping.game-admin-password.from-secret=game-admin
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.env.mapping.game-admin-password.with-key=password
# Shared cookie encryption key from the game-session secret, so a dashboard session works on every
# replica instead of only the pod that created it. Also covers the /ws/dashboard handshake.
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.env.mapping.quarkus-http-auth-session-encryption-key.from-secret=game-session
%openshift-cluster,openshift-sandbox,confluent.quarkus.openshift.env.mapping.quarkus-http-auth-session-encryption-key.with-key=encryption-key

# Edge-terminated TLS route for the profiles that don't mount their own certificate. The sandbox
# serves HTTPS directly from a mounted certificate instead.
%openshift-cluster,confluent.quarkus.openshift.route.tls.termination=edge
%openshift-cluster,confluent.quarkus.openshift.route.tls.insecure-edge-termination-policy=Redirect

############## Openshift Cluster (Strimzi) Profile ##############
%openshift-cluster.quarkus.kubernetes-client.trust-certs=true
%openshift-cluster.kafka.bootstrap.servers=my-cluster-kafka-bootstrap:9092

############## Openshift Sandbox Profile ##############
%openshift-sandbox.quarkus.http.ssl.certificate.file=/mnt/https-secret/cert.pem
%openshift-sandbox.quarkus.http.ssl.certificate.key-file=/mnt/https-secret/key.pem
%openshift-sandbox.quarkus.openshift.mounts.https-secret.path=/mnt/https-secret
%openshift-sandbox.quarkus.openshift.mounts.https-secret.read-only=true
%openshift-sandbox.quarkus.openshift.secret-volumes.https-secret.secret-name=https-secret
%openshift-sandbox.quarkus.http.insecure-requests=redirect
%openshift-sandbox.quarkus.http.ssl-port=8443
%openshift-sandbox.quarkus.openshift.ports."http".container-port=8443
%openshift-sandbox.quarkus.openshift.ports."http".host-port=8443

############## Confluent Kafka Profile ##############
%confluent.kafka.bootstrap.servers=${CONFLUENT_BOOTSTRAP_SERVERS:localhost:9092}
%confluent.kafka.security.protocol=SASL_SSL
%confluent.kafka.sasl.mechanism=PLAIN
%confluent.kafka.sasl.jaas.config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${CONFLUENT_API_KEY}" password="${CONFLUENT_API_SECRET}";
%confluent.quarkus.kafka-streams.security.protocol=SASL_SSL
%confluent.quarkus.kafka-streams.sasl.mechanism=PLAIN
%confluent.quarkus.kafka-streams.sasl.jaas-config=org.apache.kafka.common.security.plain.PlainLoginModule required username="${CONFLUENT_API_KEY}" password="${CONFLUENT_API_SECRET}";
# Confluent Cloud requires replication factor 3 for the Kafka Streams changelog topics
%confluent.kafka-streams.replication.factor=3

# only trace a sampling of the requests to avoid having too much data
# turn off otel by default
quarkus.otel.enabled=false
quarkus.otel.traces.sampler.arg=0.1
%openshift-cluster.quarkus.otel.exporter.otlp.traces.endpoint=http://jaeger-all-in-one-inmemory-collector:4317
