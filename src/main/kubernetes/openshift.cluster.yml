kind: Route
apiVersion: route.openshift.io/v1
metadata:
  name: quinoa-wind-turbine
  annotations:
    kubernetes.io/tls-acme: "true"
spec:
  to:
    kind: Service
    name: quinoa-wind-turbine
    weight: 100
  port:
    targetPort: 8080

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: power
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 1
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: game-events
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 1
  replicas: 3
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: race-progress
  labels:
    strimzi.io/cluster: my-cluster
spec:
  partitions: 1
  replicas: 3
  config:
    cleanup.policy: compact
