# App secrets for a cluster deployment, as an OpenShift template so the values are generated per
# deployment and never committed:
#
#   oc process -f src/main/kubernetes/secrets.yaml | oc apply -f -
#
# game-admin holds the dashboard login password, which replaces the game.admin.password-digest
# fallback in application.properties. When admin MCP is enabled, Keycloak reuses this same secret for
# the developer user, so the dashboard and the MCP login share one password (see
# src/main/kubernetes/keycloak).
#
# game-session holds the key that encrypts the login session cookie. Every replica needs the same key,
# otherwise a session only works on the pod that created it. Quarkus doesn't read this directory, so
# deploying the app doesn't apply it.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: wind-turbine-secrets
parameters:
  - name: GAME_ADMIN_PASSWORD
    description: Dashboard login password. Generated when not supplied.
    generate: expression
    from: '[a-zA-Z0-9]{16}'
  - name: SESSION_ENCRYPTION_KEY
    description: Shared key that encrypts the login session cookie across replicas. Generated when not supplied.
    generate: expression
    from: '[a-zA-Z0-9]{32}'
objects:
  - apiVersion: v1
    kind: Secret
    metadata:
      name: game-admin
    type: Opaque
    stringData:
      password: ${GAME_ADMIN_PASSWORD}
  - apiVersion: v1
    kind: Secret
    metadata:
      name: game-session
    type: Opaque
    stringData:
      encryption-key: ${SESSION_ENCRYPTION_KEY}
