# A fresh Keycloak instance for the admin MCP tools, for clusters that have no Keycloak yet. It creates
# PostgreSQL and the Keycloak instance; the realm import is separate (realm-import.yaml) so reusing an
# existing Keycloak doesn't replace an installation. As an OpenShift template so the hostname can be
# passed in:
#
#   oc process -f src/main/kubernetes/keycloak/keycloak.yaml -p KEYCLOAK_HOSTNAME=keycloak-demo.apps.example.com | oc apply -f -
#   oc process -f src/main/kubernetes/keycloak/realm-import.yaml | oc apply -f -
#
# To reuse an existing Keycloak instead, skip this file and apply only realm-import.yaml against it.
# Needs the Keycloak operator in the namespace, and the keycloak-db and game-admin secrets. See
# docs/openshift-install.md. Quarkus doesn't read this directory, so deploying the app doesn't apply it.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: wind-turbine-keycloak
parameters:
  - name: KEYCLOAK_HOSTNAME
    description: External host name of Keycloak, for example keycloak-demo.apps.example.com
    required: true
objects:
  # The realm import only runs once, so Keycloak keeps its data in PostgreSQL instead of a file in the pod
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: keycloak-db
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: keycloak-db
      labels:
        app: keycloak-db
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: keycloak-db
      template:
        metadata:
          labels:
            app: keycloak-db
        spec:
          containers:
            - name: postgresql
              image: registry.redhat.io/rhel9/postgresql-16:latest
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRESQL_DATABASE
                  value: keycloak
                - name: POSTGRESQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db
                      key: username
                - name: POSTGRESQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db
                      key: password
              readinessProbe:
                exec:
                  command: ["/usr/libexec/check-container"]
              volumeMounts:
                - name: data
                  mountPath: /var/lib/pgsql/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: keycloak-db
  - apiVersion: v1
    kind: Service
    metadata:
      name: keycloak-db
    spec:
      selector:
        app: keycloak-db
      ports:
        - port: 5432
          targetPort: 5432
  - apiVersion: k8s.keycloak.org/v2alpha1
    kind: Keycloak
    metadata:
      name: keycloak
    spec:
      instances: 1
      db:
        vendor: postgres
        host: keycloak-db
        database: keycloak
        usernameSecret:
          name: keycloak-db
          key: username
        passwordSecret:
          name: keycloak-db
          key: password
      # The OpenShift route terminates TLS, and Keycloak serves plain HTTP behind it
      http:
        httpEnabled: true
      proxy:
        headers: xforwarded
      hostname:
        hostname: ${KEYCLOAK_HOSTNAME}
      ingress:
        enabled: true
