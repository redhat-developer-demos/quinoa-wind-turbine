# Keycloak for the admin MCP tools, as an OpenShift template so the hostname can be passed in:
#
#   oc process -f src/main/kubernetes/keycloak/keycloak.yaml -p KEYCLOAK_HOSTNAME=keycloak-demo.apps.example.com | oc apply -f -
#
# Needs the Red Hat build of Keycloak operator in the namespace, and the keycloak-db and game-admin secrets.
# See docs/openshift-install.md. Quarkus doesn't read this directory, so deploying the app doesn't apply it.
apiVersion: template.openshift.io/v1
kind: Template
metadata:
  name: wind-turbine-keycloak
parameters:
  - name: KEYCLOAK_HOSTNAME
    description: External host name of Keycloak, for example keycloak-demo.apps.example.com
    required: true
objects:
  # The realm import only runs once, so Keycloak keeps its data in PostgreSQL instead of a file in the pod
  - apiVersion: v1
    kind: PersistentVolumeClaim
    metadata:
      name: keycloak-db
    spec:
      accessModes:
        - ReadWriteOnce
      resources:
        requests:
          storage: 1Gi
  - apiVersion: apps/v1
    kind: Deployment
    metadata:
      name: keycloak-db
      labels:
        app: keycloak-db
    spec:
      replicas: 1
      strategy:
        type: Recreate
      selector:
        matchLabels:
          app: keycloak-db
      template:
        metadata:
          labels:
            app: keycloak-db
        spec:
          containers:
            - name: postgresql
              image: registry.redhat.io/rhel9/postgresql-16:latest
              ports:
                - containerPort: 5432
              env:
                - name: POSTGRESQL_DATABASE
                  value: keycloak
                - name: POSTGRESQL_USER
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db
                      key: username
                - name: POSTGRESQL_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: keycloak-db
                      key: password
              readinessProbe:
                exec:
                  command: ["/usr/libexec/check-container"]
              volumeMounts:
                - name: data
                  mountPath: /var/lib/pgsql/data
          volumes:
            - name: data
              persistentVolumeClaim:
                claimName: keycloak-db
  - apiVersion: v1
    kind: Service
    metadata:
      name: keycloak-db
    spec:
      selector:
        app: keycloak-db
      ports:
        - port: 5432
          targetPort: 5432
  - apiVersion: k8s.keycloak.org/v2beta1
    kind: Keycloak
    metadata:
      name: keycloak
    spec:
      instances: 1
      db:
        vendor: postgres
        host: keycloak-db
        database: keycloak
        usernameSecret:
          name: keycloak-db
          key: username
        passwordSecret:
          name: keycloak-db
          key: password
      # The OpenShift route terminates TLS, and Keycloak serves plain HTTP behind it
      http:
        httpEnabled: true
      proxy:
        headers: xforwarded
      hostname:
        hostname: ${KEYCLOAK_HOSTNAME}
      ingress:
        enabled: true
  - apiVersion: k8s.keycloak.org/v2beta1
    kind: KeycloakRealmImport
    metadata:
      name: wind-turbine
    spec:
      keycloakCRName: keycloak
      # The import job reads the developer password from the game-admin secret, which the dashboard login uses too
      placeholders:
        GAME_ADMIN_PASSWORD:
          secret:
            name: game-admin
            key: password
      realm:
        realm: wind-turbine
        enabled: true
        sslRequired: external
        roles:
          realm:
            - name: admin
              description: Can start, pause and reset the race
        users:
          - username: developer
            enabled: true
            email: developer@example.com
            emailVerified: true
            firstName: Race
            lastName: Operator
            credentials:
              - type: password
                value: ${GAME_ADMIN_PASSWORD}
                temporary: false
            realmRoles:
              - admin
        clients:
          - clientId: wind-turbine
            name: Wind turbine race
            enabled: true
            publicClient: false
            standardFlowEnabled: false
            directAccessGrantsEnabled: false
            serviceAccountsEnabled: false
          - clientId: mcp-agent
            name: MCP agents
            description: Public client for MCP clients such as Claude Code and goose
            enabled: true
            publicClient: true
            standardFlowEnabled: true
            directAccessGrantsEnabled: false
            redirectUris:
              - http://localhost:33418/callback
              - http://127.0.0.1:33418/callback
            webOrigins:
              - "+"
            attributes:
              pkce.code.challenge.method: S256
            protocolMappers:
              - name: wind-turbine-audience
                protocol: openid-connect
                protocolMapper: oidc-audience-mapper
                consentRequired: false
                config:
                  included.client.audience: wind-turbine
                  id.token.claim: "false"
                  access.token.claim: "true"
                  introspection.token.claim: "true"
