# Test configuration
# e2e needs a browser. optional covers the AI and cheat features, which each need their own app boot.
# Run them with ./mvnw test -Pe2e or ./mvnw test -Poptional.
quarkus.test.exclude-tags=e2e,optional
# Don't wait out the 30s graceful shutdown that production uses
quarkus.shutdown.timeout=PT2S
